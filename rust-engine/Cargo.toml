[package]
name = "librecut-engine"
version = "2.0.0"
edition = "2021"
authors = ["LibreCut Contributors", "Jakub"]
description = "High-performance Rust video editing and rendering engine for Android 14+ (LibreCuts Fork)"
license = "MIT"

[lib]
name = "librecut_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
ndk = { version = "0.9.0", default-features = false, features = ["media"] }
ndk-sys = "0.6.0"
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
log = "0.4.22"
android_logger = "0.14.1"
thiserror = "1.0.64"
byteorder = "1.5.0"
once_cell = "1.19.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
