name: Build LibreCut RS (Android 14+)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Engine & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install Android NDK & Platforms
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Engine (with 16KB page alignment)
        run: |
          cd rust-engine
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build Android APK with Gradle
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Variants
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-apks"
          cd app/build/outputs/apk/release/
          ls -la
          for f in *.apk; do
            if [[ "$f" == *"universal"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.1-universal.apk"
            elif [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.1-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.1-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.1-x86_64.apk"
            else
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/$f"
            fi
          done
          cd "${GITHUB_WORKSPACE}/release-apks"
          ls -lh

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: librecuts-rust-release-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release v2.4.1
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.1
          name: "LibreCut RS v2.4.1 - Interactive Transforms, Real SFX & Precision Audio Boost"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apks/*.apk
          body: |
            # LibreCut RS v2.4.1

            > **Engineered & Designed with AI** (Google Antigravity AI) for **Tobiasz (PolskieWin)**  
            > *100% Offline • F-Droid Compliant • Rust Native SIMD • Vulkan GPU Compute • Material You • Electric Blue*

            A major stability, transform, audio, and subtitle update for LibreCut RS.

            ---

            ### 📦 Download Variants
            - **Universal APK (`LibreCut-RS-v2.4.1-universal.apk`)**: Bundles all architectures (`arm64-v8a`, `armeabi-v7a`, `x86_64`). Compatible with all Android devices (higher MB).
            - **ARMv8 64-bit APK (`LibreCut-RS-v2.4.1-arm64-v8a.apk`)**: Highly optimized for all modern 64-bit Android smartphones (lower MB, ~3 MB).
            - **ARMv7 32-bit APK (`LibreCut-RS-v2.4.1-armeabi-v7a.apk`)**: Optimized for older 32-bit Android phones and tablets (lower MB, ~2.8 MB).
            - **x86_64 APK (`LibreCut-RS-v2.4.1-x86_64.apk`)**: For Android emulators and Chromebooks (lower MB, ~3.1 MB).

            ---

            ### ✨ What's New in v2.4.1
            - **Interactive Resizing & Moving (Pinch & Pan Gestures)**: Pinch-to-zoom to resize and drag to move photos, videos, and text overlays directly on the live preview screen.
            - **Hardware-Accelerated Audio Boost (up to 200%)**: Integrated Android `LoudnessEnhancer` hardware audio processor so boosting volume above 100% genuinely amplifies audio playback and preview.
            - **Real Sound Effects Engine**: Built-in 100% offline PCM WAV audio synthesizer generating authentic, broadcast-quality audio files (*Cinematic Boom*, *Fast Air Whoosh*, *UI Pop Click*, *Tension Riser*, *Vinyl Scratch*) that play natively in ExoPlayer and render in exported videos.
            - **Custom Script & Lyrics Subtitle Tool**: Paste scripts, song lyrics, or dialogue to instantly generate timed subtitle clips along the timeline. Tap any subtitle on screen to edit its text, font size, and color!
            - **Active Clip Resolution Fix**: Live preview player dynamically follows the playhead across cuts and multiple clips, guaranteeing color grading, filters, and volume apply instantly.
            - **Background Progress Preservation**: Seamlessly restores your active project and playhead position even if Android suspends or kills the app in the background.
