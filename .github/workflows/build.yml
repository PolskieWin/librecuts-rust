name: Build LibreCut RS (Android 14+)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Engine & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install Android NDK & Platforms
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Engine (with 16KB page alignment)
        run: |
          cd rust-engine
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build Android APK with Gradle
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Variants
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-apks"
          cd app/build/outputs/apk/release/
          ls -la
          for f in *.apk; do
            if [[ "$f" == *"universal"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.4-universal.apk"
            elif [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.4-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.4-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.4-x86_64.apk"
            else
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/$f"
            fi
          done
          cd "${GITHUB_WORKSPACE}/release-apks"
          ls -lh

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
            name: librecuts-rust-release-apks
            path: release-apks/*.apk

      - name: Publish GitHub Release v2.4.4
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v2.4.4
            name: "LibreCut RS v2.4.4 - Export Pipeline Fix, Reliable Font & ZIP Importer & Complete Polish/Spanish Localization"
            draft: false
            prerelease: false
            make_latest: true
            files: release-apks/*.apk
            body: |
              # LibreCut RS v2.4.4

              > **Engineered & Designed with AI** (Google Antigravity AI) for **Tobiasz (PolskieWin)**  
              > *100% Offline • F-Droid Compliant • Rust Native SIMD • Vulkan GPU Compute • Material You • Custom Color Theming*

              Major stability and fix release addressing export pipeline errors, typography font imports, and comprehensive Polish and Spanish button localization.

              ---

              ### Download Variants
              - **Universal APK (`LibreCut-RS-v2.4.4-universal.apk`)**: Bundles all architectures (`arm64-v8a`, `armeabi-v7a`, `x86_64`). Compatible with all Android devices (~4.5 MB).
              - **ARMv8 64-bit APK (`LibreCut-RS-v2.4.4-arm64-v8a.apk`)**: Highly optimized for all modern 64-bit Android smartphones (~3.1 MB).
              - **ARMv7 32-bit APK (`LibreCut-RS-v2.4.4-armeabi-v7a.apk`)**: Optimized for older 32-bit Android phones and tablets (~2.8 MB).
              - **x86_64 APK (`LibreCut-RS-v2.4.4-x86_64.apk`)**: For Android emulators and Chromebooks (~3.1 MB).

              ---

              ### What's Fixed & Added in v2.4.4
              - **Fixed Export Error ("Native rendering pipeline returned false")**:
                - Resolved Rust `serde` deserialization mismatch on `Keyframe`, `Clip`, and `EffectConfig` structures.
                - Added fallback aliases (`timeMs`/`time_ms`, `sourceStartMs`/`source_start_ms`, `transitionDurationMs`, etc.) and default fields across all composition entities.
                - Ensured export output directory exists prior to invocation (`outputDir.mkdirs()`) preventing `libc::open` `ENOENT` failures.
                - Added automatic fallback to Android `MediaMuxer` pipeline if native render pipeline encounters unsupported streams.
              - **Robust Custom Font & ZIP Archive Importer**:
                - Inspects true stream header bytes (ZIP magic `0x50 0x4B`) to reliably detect archives regardless of file extension or MIME type.
                - Properly extracts `.ttf` and `.otf` fonts from DaFont, Google Fonts, and custom archives while safely ignoring `__MACOSX` resource forks and hidden directories.
                - Employs `Typeface.createFromFile` to load Compose `FontFamily` reliably across all Android 14+ devices without crashes.
                - Enabled horizontal scrolling chip selector for installed fonts in Settings.
              - **Complete Polish & Spanish UI Localization**:
                - Localized all remaining hardcoded button labels, dialog actions, bottom sheet descriptions, and headers across the application.
                - Includes full Polish and Spanish translations for: Split, Speed, Keyframe, Add, Save, Cancel, Jump, Audition Voice, Add to Timeline, TTS Voiceover, Subtitle Editor, Script to Subtitles, Cutout Sensitivity, Edge Feather, Invert Cutout, Transitions, Crop boundaries, and Community Plugins.
              - **Zero Internet Guarantee**:
                - 100% offline with zero network permissions in `AndroidManifest.xml`. Built for privacy, performance, and F-Droid standards.
