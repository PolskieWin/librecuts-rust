name: Build LibreCut RS (Android 14+)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Engine & APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install Android NDK & Platforms
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Engine (with 16KB page alignment)
        run: |
          cd rust-engine
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Build Android APK with Gradle
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK Variants
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-apks"
          cd app/build/outputs/apk/release/
          ls -la
          for f in *.apk; do
            if [[ "$f" == *"universal"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.7-universal.apk"
            elif [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.7-arm64-v8a.apk"
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.7-armeabi-v7a.apk"
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/LibreCut-RS-v2.4.7-x86_64.apk"
            else
              cp "$f" "${GITHUB_WORKSPACE}/release-apks/$f"
            fi
          done
          cd "${GITHUB_WORKSPACE}/release-apks"
          ls -lh

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
            name: librecuts-rust-release-apks
            path: release-apks/*.apk

      - name: Publish GitHub Release v2.4.7
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v2.4.7
            name: "LibreCut RS v2.4.7 - Complete Bug Fixes, Native Export Engine, SFX Tracks, Font Picker, and Audio Boost"
            draft: false
            prerelease: false
            make_latest: true
            files: release-apks/*.apk
            body: |
              # LibreCut RS v2.4.7

              > **Engineered & Designed with AI** (Google Antigravity AI) for **Tobiasz (PolskieWin)**  
              > *100% Offline • F-Droid Compliant • Rust Native SIMD • Vulkan GPU Compute • Material You • Custom Color Theming*

              Comprehensive bug-fixing release resolving export pipeline failures, SFX playback and track addition, font import and zip loading, text/subtitle customization, audio volume boost, and preview gesture transformations.

              ---

              ### Download Variants
              - **Universal APK (`LibreCut-RS-v2.4.7-universal.apk`)**: Bundles all architectures (`arm64-v8a`, `armeabi-v7a`, `x86_64`). Compatible with all Android devices (~4.5 MB).
              - **ARMv8 64-bit APK (`LibreCut-RS-v2.4.7-arm64-v8a.apk`)**: Highly optimized for all modern 64-bit Android smartphones (~3.1 MB).
              - **ARMv7 32-bit APK (`LibreCut-RS-v2.4.7-armeabi-v7a.apk`)**: Optimized for older 32-bit Android phones and tablets (~2.8 MB).
              - **x86_64 APK (`LibreCut-RS-v2.4.7-x86_64.apk`)**: For Android emulators and Chromebooks (~3.1 MB).

              ---

              ### What's Fixed & Improved in v2.4.7
              - **Native Export Rendering Pipeline & Deserialization**:
                - Fixed `serde_json` composition deserialization error by changing `TextOverlay` color fields from `u64` to `i64`, properly accepting negative ARGB values passed from Android.
                - Added `#[serde(other)] Unknown` fallback variant to `EffectConfig` to prevent export pipeline failures on unrecognized effect attributes.
                - Enhanced `fallbackExportWithAndroidMediaMuxer` to scan all media tracks and preserve local copies seamlessly.
              - **Sound Effects & Audio Playback**:
                - Auto-create `TrackType.Audio` track on importing music or selecting sound effects (Vine Boom, Bruh, Airhorn, etc.), fixing the issue where SFX and audio were ignored when no audio track existed.
                - Enabled audio volume boost (>100%) in video preview player with `LoudnessEnhancer` up to 2000mB.
              - **Font Picker & Custom ZIP Font Archive Support**:
                - Added font selection row and direct `+ Import (.ttf/.otf/.zip)` launcher inside `TextEditorDialog`.
                - Auto-extracts TTF and OTF fonts from ZIP archives and applies them immediately with custom typeface cache.
                - Movable and resizable text overlay gestures in preview player, persisting X, Y, and font size directly.
              - **Media URI Resolution & Image Extensions**:
                - Fixed `resolveMediaUriToLocalFile` forcing `.mp4` onto all files. Now preserves actual extensions (`.png`, `.jpg`, `.webp`, `.mp3`, `.wav`, `.ttf`, `.otf`, `.zip`) and sets appropriate image duration.
              - **Timeline & Gesture Fixes**:
                - Fixed bottom free space timestamp scrubbing by wrapping playhead position with `rememberUpdatedState` to avoid jumps or resets.
                - Clamped transition and animation badges to clip width so they never overflow.
                - Corrected pan/zoom gestures in preview player to avoid double accumulation.
                - Fixed project thumbnail aspect ratio stretching.
              - **Full Polish & Spanish Localization**:
                - Fully localized all editor buttons, empty media banners, timestamp scrubbing hint, and font options across English, Spanish, and Polish without English leftovers.
              - **Zero Internet Guarantee**:
                - 100% offline with zero network permissions in `AndroidManifest.xml`. Built for privacy, performance, and F-Droid standards.
                - Jump to timestamp instruction dialog and timecode pills.
                - Community plugins sheet and parameter controls.
                - Export and compression progress, ETA countdown, and status dialogs.
              - **Resolved Crash on New Project**:
                - Fixed empty composition state where uninitialized ExoPlayer/PlayerView attempted to inflate without active media items.
                - Replaced void preview with an informative "No Media Added" canvas with quick-access clip import guidance.
                - Protected LoudnessEnhancer with safe Throwable handling against audio session ID zero initialization.
                - Removed premature list modification during project creation and navigation.
              - **Motion Blur Filter & Creative Effects**:
                - Added multi-threaded Rust SIMD motion blur box filter (`rust-engine/src/effects/filters.rs`).
                - Added Motion Blur to filter selection with dynamic intensity adjustment slider.
                - Added Compose preview blend overlay simulating real-time shutter blur.
              - **Speed Curves & Keyframe Easing Graphs**:
                - Visual interactive Bezier curve canvas in Effects Sheet for speed ramping presets (Montage, Hero Moment, Bullet Time, Flash In, Normal).
                - Keyframe easing types (Linear, Ease In, Ease Out, Ease In-Out, Bounce) with visual curve graphs.
              - **Estimated Export Completion Time (ETA)**:
                - Real-time rendering percentage with accurate countdown estimation (`ETA: MM:SS`) in the Export Dialog.
              - **Timeline Timestamp Scrubbing via Bottom Free Space**:
                - Scrubbing playhead now works smoothly by dragging or tapping anywhere in the bottom empty space below timeline tracks.
              - **Un-stretched Project Thumbnails**:
                - Replaced rigid aspect ratio squashing in `ThumbnailCache` with proportional aspect-ratio scaling.
                - Fixed project card image container to preserve true video/image aspect ratio without stretching.
              - **Text Outline, Color Customization & Font Picker in Text Editor**:
                - Added stroke width slider (0 to 12px) and outline color palette (Black, White, Red, Blue, Gold).
                - Added text color palette (White, Yellow, Orange, Red, Green, Cyan, Pink, Dark).
                - Subtitle editor dialog now lets users edit text, colors, outlines, and fonts on the spot.
                - Automatically syncs and persists custom fonts on import.
              - **Video, Photo & Text Resizing**:
                - Added scale slider in Transform tab and pinch-to-zoom support for video and photo overlays.
                - Font size and scale gestures for text overlays.
              - **Timeline Markers for Transitions & Animations**:
                - Transition badges at clip start timestamps with duration indicator.
                - Animation badges at clip in/out timestamps.
                - Transition and animation durations are clamped so they can be smaller, but never bigger than the clip duration.
              - **Plugin Development Tutorial in Repository**:
                - Added `docs/PLUGINS.md` detailing how to create custom `.lcplugin` UI layout designs and video filter plugins.
              - **Zero Internet Guarantee**:
                - 100% offline with zero network permissions in `AndroidManifest.xml`. Built for privacy, performance, and F-Droid standards.
